import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.copte.katameros'
    compileSdk 36

    defaultConfig {
        applicationId "com.copte.katameros"
        // 26 : java.time disponible sans désugarisation (utilisé par coptic-calendar-core).
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Source des mises à jour de contenu (manifest.json + fichiers JSON), sans republier l'APK.
        buildConfigField "String", "CONTENT_BASE_URL",
            "\"https://raw.githubusercontent.com/asel-hue/KatamerosCopte/main/app/src/main/assets/katameros/\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation project(':core-liturgy')
    implementation project(':widget')

    // core-ktx 1.18+ exige compileSdk 37 ; 1.17.0 est la dernière version compatible compileSdk 36.
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    testImplementation 'junit:junit:4.13.2'
}
