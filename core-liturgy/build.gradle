import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// Données liturgiques de l'application : chargement des JSON (lectures, Synaxaire) pour un jour copte.
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.copte.katameros.liturgy'
    compileSdk 36
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions { jvmTarget = JvmTarget.JVM_17 }
}

dependencies {
    api rootProject.ext.copticCalendarCore
    testImplementation 'junit:junit:4.13.2'
    // org.json est fourni par Android à l'exécution, mais pas dans les tests JVM.
    testImplementation 'org.json:json:20240303'
}
